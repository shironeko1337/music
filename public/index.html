<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar Shell Explorer</title>
</head>
<body style="margin:0; padding:16px; background:#020617;">
<div id="guitar-shell-explorer" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; border-radius: 12px; max-width: 900px; border: 1px solid #334155;">
  <h3 style="margin: 0 0 14px 0; font-size: 18px; color: #f1f5f9;">Movable Guitar Shell & Inversion Explorer</h3>

  <!-- Controls Grid -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; background: #1e293b; padding: 12px; border-radius: 8px;">
    <div>
      <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">Root String</label>
      <select id="gs-root-str" style="width:100%; padding:6px; border-radius:6px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <option value="6">String 6 (Low E)</option>
        <option value="5" selected>String 5 (A)</option>
        <option value="4">String 4 (D)</option>
      </select>
    </div>

    <div>
      <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">Root Note</label>
      <select id="gs-root-note" style="width:100%; padding:6px; border-radius:6px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <option value="C" selected>C</option>
        <option value="A">A</option>
        <option value="G">G</option>
        <option value="E">E</option>
        <option value="D">D</option>
      </select>
    </div>

    <div>
      <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">Chord Type</label>
      <select id="gs-chord-type" style="width:100%; padding:6px; border-radius:6px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <option value="maj">Major (R + 3 + 5)</option>
        <option value="min">Minor (R + b3 + 5)</option>
        <option value="maj7">Maj7 (3 + 7)</option>
        <option value="m7">m7 (b3 + b7)</option>
        <option value="7">Dom 7 (3 + b7)</option>
        <option value="9" selected>Dom 9 (3 + b7 + 9)</option>
        <option value="11">Dom 11 (3 + b7 + 11)</option>
        <option value="13">Dom 13 (3 + b7 + 13)</option>
        <option value="slash6">Slash /6th in Bass (e.g. C/A = Am7)</option>
      </select>
    </div>

    <div>
      <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">Relative Pos. of 3rd (Inversion)</label>
      <select id="gs-third-pos" style="width:100%; padding:6px; border-radius:6px; background:#0f172a; color:#fff; border:1px solid #475569;">
        <option value="up1" selected>1 String Higher (Close / Std 5th-Str)</option>
        <option value="up2">2 Strings Higher (Spread / Std 6th-Str)</option>
        <option value="up3">3 Strings Higher (3rd on Top Voice)</option>
        <option value="down1">1 String Lower in Pitch (1st Inv: 3rd in Bass)</option>
      </select>
    </div>
  </div>

  <!-- Info Banner -->
  <div id="gs-status" style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; background:#1e293b; padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:13px; border-left: 4px solid #38bdf8;"></div>

  <!-- Fretboard Canvas -->
  <div style="overflow-x: auto;">
    <canvas id="gs-canvas" width="860" height="270" style="width:100%; max-width:860px; background:#0b1120; border-radius:8px; display:block;"></canvas>
  </div>

  <!-- Legend -->
  <div style="display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:12px; color:#cbd5e1;">
    <span><b style="color:#ef4444;">● R</b> Root</span>
    <span><b style="color:#f59e0b;">● 3 / b3</b> 3rd (Determines Inversion if in Bass)</span>
    <span><b style="color:#3b82f6;">● 7 / b7</b> 7th</span>
    <span><b style="color:#10b981;">● 9 / 11 / 13 / 6</b> Extension</span>
    <span><b style="color:#64748b;">● 5</b> 5th (Gray)</span>
    <span>Markers left of the nut = open string (fret 0)</span>
  </div>
</div>

<script>
// Pure voicing logic (no DOM), exposed as globalThis.GuitarVoicing.
(function() {
  // Open string pitch classes (C=0, C#=1, D=2, D#=3, E=4, F=5, F#=6, G=7, G#=8, A=9, A#=10, B=11)
  // String index: 6=Low E, 5=A, 4=D, 3=G, 2=B, 1=High E
  const OPEN_PITCH = { 6: 4, 5: 9, 4: 2, 3: 7, 2: 11, 1: 4 };
  const NOTE_VAL = { C: 0, "C#": 1, D: 2, "D#": 3, E: 4, F: 5, "F#": 6, G: 7, "G#": 8, A: 9, "A#": 10, B: 11 };
  const MAX_FRET = 15;

  // tones: semitones above root -> { label, required }. The 3rd is placed by the "3rd position" option.
  const CHORD_SPECS = {
    maj:    { name: "",      third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false] } },
    min:    { name: "m",     third: 3, tones: { 0: ["R", true], 3: ["b3", true], 7: ["5", false] } },
    maj7:   { name: "maj7",  third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false], 11: ["7", true] } },
    m7:     { name: "m7",    third: 3, tones: { 0: ["R", true], 3: ["b3", true], 7: ["5", false], 10: ["b7", true] } },
    "7":    { name: "7",     third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false], 10: ["b7", true] } },
    "9":    { name: "9",     third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false], 10: ["b7", true], 2: ["9", true] } },
    "11":   { name: "11",    third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false], 10: ["b7", true], 2: ["9", false], 5: ["11", true] } },
    "13":   { name: "13",    third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false], 10: ["b7", true], 2: ["9", false], 9: ["13", true] } },
    // C/A: A C E G = Am7. The 6th sits in the bass, one string below the root.
    slash6: { name: "/6",    third: 4, tones: { 0: ["R", true], 4: ["3", true],  7: ["5", false], 9: ["6", true] } }
  };

  // Hand-checked shapes that override the search. frets are strings 6 -> 1, null = muted.
  const CORNER_CASES = [
    { root: "E", rootStr: 6, chord: "maj7", thirdPos: "up3", frets: [0, 2, 1, 1, 0, 0] },
    { root: "E", rootStr: 6, chord: "maj",  thirdPos: "up3", frets: [0, 2, 2, 1, 0, 0] },
    { root: "C", rootStr: 5, chord: "maj",  thirdPos: "up1", frets: [null, 3, 2, 0, 1, 0] },
    { root: "C", rootStr: 5, chord: "maj7", thirdPos: "up1", frets: [null, 3, 2, 0, 0, 0] }
  ];

  const THIRD_OFFSET = { up1: -1, up2: -2, up3: -3, down1: 1 };

  const pitchAt = (str, fret) => (OPEN_PITCH[str] + fret) % 12;

  function labelFor(spec, rootPC, str, fret) {
    const iv = (pitchAt(str, fret) - rootPC + 12) % 12;
    return spec.tones[iv] ? spec.tones[iv][0] : null;
  }

  // Fingers needed: one per fretted note, except a barre across the lowest fret
  // (only possible when no open string sounds above the barre's lowest string).
  function fingerCount(frets) {
    const fretted = [];
    for (let s = 6; s >= 1; s--) if (frets[s] != null && frets[s] > 0) fretted.push(s);
    if (fretted.length === 0) return 0;
    const minFret = Math.min(...fretted.map(s => frets[s]));
    const atMin = fretted.filter(s => frets[s] === minFret);
    if (atMin.length < 2) return fretted.length;
    const barreLow = Math.max(...atMin);
    for (let s = barreLow - 1; s >= 1; s--) if (frets[s] === 0) return fretted.length;
    return fretted.length - atMin.length + 1;
  }

  function scoreVoicing(frets, spec, rootPC, maxSpan) {
    const played = [6, 5, 4, 3, 2, 1].filter(s => frets[s] != null);
    const fretted = played.filter(s => frets[s] > 0).map(s => frets[s]);
    const span = fretted.length ? Math.max(...fretted) - Math.min(...fretted) : 0;
    if (span > maxSpan) return null;
    // Hand is well up the neck: open strings can't be mixed in
    if (fretted.length && Math.min(...fretted) > 5 && played.some(s => frets[s] === 0)) return null;
    const fingers = fingerCount(frets);
    if (fingers > 4) return null;

    const counts = {};
    played.forEach(s => {
      const l = labelFor(spec, rootPC, s, frets[s]);
      counts[l] = (counts[l] || 0) + 1;
    });
    for (const iv in spec.tones) {
      const [label, required] = spec.tones[iv];
      if (required && !counts[label]) return null;
    }

    let score = played.length * 10 - fingers * 4 - span * 3;
    // Open strings help near the nut, but are awkward to mix with shapes higher up the neck
    const opens = played.filter(s => frets[s] === 0).length;
    score += (fretted.length && Math.max(...fretted) > 5) ? -3 * opens : opens;
    // Muted strings inside the voicing are awkward to damp
    const top = Math.min(...played), bottom = Math.max(...played);
    for (let s = top; s <= bottom; s++) if (frets[s] == null) score -= 12;
    for (const iv in spec.tones) {
      const [label, required] = spec.tones[iv];
      const n = counts[label] || 0;
      if (!required && n === 0) score -= 2;
      if (n > 1 && label !== "R" && label !== "5") score -= (label === "3" || label === "b3") ? 3 : 5;
    }
    return score;
  }

  // Returns { frets: {1..6: fret|null}, labels, bassStr, error? }
  function computeVoicing(rootStr, rootName, chordKey, thirdPos) {
    const spec = CHORD_SPECS[chordKey];
    const rootPC = NOTE_VAL[rootName];
    const thirdPC = (rootPC + spec.third) % 12;
    const thirdStr = rootStr + THIRD_OFFSET[thirdPos];

    if (thirdStr < 1 || thirdStr > 6) {
      return { error: "No string " + (thirdPos === "down1" ? "below" : "above") + " string " + rootStr + " for the 3rd in this position." };
    }
    let sixthStr = null;
    if (chordKey === "slash6") {
      sixthStr = rootStr + 1;
      if (sixthStr > 6) return { error: "Slash /6th needs a string below the root; pick root on string 5 or 4." };
      if (sixthStr === thirdStr) return { error: "Slash /6th puts the 6th in the bass, so the 3rd can't be there too." };
    }
    const bassStr = sixthStr || Math.max(rootStr, thirdStr);

    const corner = CORNER_CASES.find(c => c.root === rootName && c.rootStr === rootStr && c.chord === chordKey && c.thirdPos === thirdPos);
    if (corner) {
      const frets = {};
      corner.frets.forEach((f, i) => { frets[6 - i] = f; });
      return finish(frets, spec, rootPC, bassStr, true);
    }

    const fretsFor = (str, pc) => {
      const out = [];
      for (let f = 0; f <= MAX_FRET; f++) if (pitchAt(str, f) === pc) out.push(f);
      return out;
    };

    for (const maxSpan of [3, 4]) {
      let best = null, bestScore = -Infinity;
      for (const rootFret of fretsFor(rootStr, rootPC)) {
        for (const thirdFret of fretsFor(thirdStr, thirdPC)) {
          if (rootFret > 0 && thirdFret > 0 && Math.abs(rootFret - thirdFret) > maxSpan) continue;
          // An open root only works with a shape near the nut; otherwise use the octave (fret 12)
          if (rootFret === 0 && thirdFret > maxSpan + 1) continue;
          const fixed = { [rootStr]: rootFret, [thirdStr]: thirdFret };
          if (sixthStr) {
            const f6 = fretsFor(sixthStr, (rootPC + 9) % 12).find(f => f === 0 || (rootFret === 0 || Math.abs(f - rootFret) <= maxSpan));
            if (f6 === undefined) continue;
            fixed[sixthStr] = f6;
          }
          const anchor = rootFret || thirdFret;
          const free = [];
          for (let s = bassStr - 1; s >= 1; s--) if (fixed[s] === undefined) free.push(s);

          // Options per free string: muted, or any chord tone near the anchor / open.
          // The 3rd may only double above the chosen 3rd string.
          const options = free.map(s => {
            const opts = [null];
            for (let f = 0; f <= MAX_FRET; f++) {
              if (f > 0 && anchor > 0 && Math.abs(f - anchor) > maxSpan) continue;
              if (f > 0 && anchor === 0 && f > maxSpan + 1) continue;
              const l = labelFor(spec, rootPC, s, f);
              if (!l) continue;
              if ((l === "3" || l === "b3") && s > thirdStr) continue;
              opts.push(f);
            }
            return opts;
          });

          const frets = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, ...fixed };
          (function walk(i) {
            if (i === free.length) {
              const sc = scoreVoicing(frets, spec, rootPC, maxSpan);
              if (sc != null && sc > bestScore) { bestScore = sc; best = { ...frets }; }
              return;
            }
            for (const f of options[i]) { frets[free[i]] = f; walk(i + 1); }
            frets[free[i]] = null;
          })(0);
        }
        if (best) break; // prefer the lowest root position that works
      }
      if (best) return finish(best, spec, rootPC, bassStr, false);
    }
    return { error: "No playable voicing found for this combination." };
  }

  function finish(frets, spec, rootPC, bassStr, fromCornerCase) {
    const labels = {};
    for (let s = 1; s <= 6; s++) if (frets[s] != null) labels[s] = labelFor(spec, rootPC, s, frets[s]);
    return { frets, labels, bassStr, fromCornerCase };
  }

  globalThis.GuitarVoicing = { computeVoicing, CHORD_SPECS, CORNER_CASES };
})();
</script>

<script>
(function() {
  if (typeof document === "undefined") return;
  const { computeVoicing, CHORD_SPECS } = globalThis.GuitarVoicing;

  const COLORS = {
    "R":  "#ef4444",
    "3":  "#f59e0b", "b3": "#f59e0b",
    "7":  "#3b82f6", "b7": "#3b82f6",
    "9":  "#10b981", "11": "#10b981", "13": "#10b981", "6": "#10b981",
    "5":  "#64748b" // Gray marker for 5th
  };

  function inversionText(rootName, bassLabel) {
    if (bassLabel === "3" || bassLabel === "b3") return "1st Inversion (3rd in Bass, e.g. " + rootName + "/3rd)";
    if (bassLabel === "5") return "2nd Inversion (5th in Bass)";
    if (bassLabel === "6") return "Relative Minor Slash (" + rootName + "/6th = rel. m7)";
    return "Root Position (R in Bass)";
  }

  function render() {
    const rootStr = parseInt(document.getElementById("gs-root-str").value, 10);
    const rootName = document.getElementById("gs-root-note").value;
    const chordKey = document.getElementById("gs-chord-type").value;
    const thirdPos = document.getElementById("gs-third-pos").value;

    const result = computeVoicing(rootStr, rootName, chordKey, thirdPos);
    const chordName = rootName + CHORD_SPECS[chordKey].name;
    const status = document.getElementById("gs-status");
    const frets = result.frets || {};
    const labels = result.labels || {};

    if (result.error) {
      status.innerHTML = "<div><strong>" + chordName + "</strong> &nbsp;|&nbsp; <span style='color:#f87171;'>" + result.error + "</span></div>";
    } else {
      const played = [6, 5, 4, 3, 2, 1].filter(s => frets[s] != null);
      const tab = [6, 5, 4, 3, 2, 1].map(s => frets[s] == null ? "x" : frets[s]);
      status.innerHTML =
        "<div><strong>" + chordName + "</strong> &nbsp;|&nbsp; <span style='color:#38bdf8;'>" + inversionText(rootName, labels[played[0]]) + "</span></div>" +
        "<div style='font-family:monospace; color:#fde047;'>Tab (6→1): " + tab.join(" ") + "</div>";
    }

    const canvas = document.getElementById("gs-canvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const padL = 95, padR = 20, padT = 32, padB = 38;
    const numFrets = 15;
    const fretW = (canvas.width - padL - padR) / numFrets;
    const strH = (canvas.height - padT - padB) / 5;
    const openX = padL - 22;

    // Fret numbers & inlays (0 = open string column left of the nut)
    ctx.fillStyle = "#64748b";
    ctx.font = "12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(0, openX, canvas.height - 10);
    const inlays = [3, 5, 7, 9, 12, 15];
    for (let f = 1; f <= numFrets; f++) {
      const xCenter = padL + (f - 0.5) * fretW;
      ctx.fillText(f, xCenter, canvas.height - 10);
      if (inlays.includes(f)) {
        ctx.beginPath();
        ctx.arc(xCenter, padT + 2.5 * strH, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#1e293b";
        ctx.fill();
        ctx.fillStyle = "#64748b";
      }
    }

    // Fret wires (f = 0 is the nut)
    for (let f = 0; f <= numFrets; f++) {
      const x = padL + f * fretW;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + 5 * strH);
      ctx.strokeStyle = f === 0 ? "#94a3b8" : "#334155";
      ctx.lineWidth = f === 0 ? 4 : 1.5;
      ctx.stroke();
    }

    // Strings (Top = String 1 High E, Bottom = String 6 Low E)
    const strNames = { 1: "1 (E)", 2: "2 (B)", 3: "3 (G)", 4: "4 (D)", 5: "5 (A)", 6: "6 (E)" };
    for (let s = 1; s <= 6; s++) {
      const y = padT + (s - 1) * strH;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(canvas.width - padR, y);
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 1 + (s - 1) * 0.35;
      ctx.stroke();

      ctx.fillStyle = frets[s] != null ? "#e2e8f0" : "#475569";
      ctx.font = "12px monospace";
      ctx.textAlign = "right";
      ctx.fillText(strNames[s], openX - 18, y + 4);

      if (frets[s] == null) {
        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("×", openX, y + 5);
      }
    }

    // Markers (interval labels; open strings drawn left of the nut)
    for (let s = 1; s <= 6; s++) {
      if (frets[s] == null) continue;
      const label = labels[s];
      const x = frets[s] === 0 ? openX : padL + (frets[s] - 0.5) * fretW;
      const y = padT + (s - 1) * strH;

      ctx.beginPath();
      ctx.arc(x, y, frets[s] === 0 ? 12 : 14, 0, Math.PI * 2);
      ctx.fillStyle = COLORS[label] || "#64748b";
      ctx.fill();
      ctx.lineWidth = label === "5" ? 1.5 : 2.5;
      ctx.strokeStyle = label === "5" ? "#94a3b8" : "#ffffff";
      if (label === "5") ctx.setLineDash([3, 2]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y + 4);
    }
  }

  ["gs-root-str", "gs-root-note", "gs-chord-type", "gs-third-pos"].forEach(id => {
    document.getElementById(id).addEventListener("change", render);
  });
  render();
})();
</script>
</body>
</html>
